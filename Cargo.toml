[workspace]
resolver = "2"
members = [
    "quanta-lexer",
    "quanta-ast",
    "quanta-parser",
    "quanta-typeck",
    "quanta-codegen",
    "quanta-emit",
    "quanta-web",
    "quanta-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
