[package]
publish = false
name = "quanta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quanta-cli"
path = "src/main.rs"

[dependencies]
quanta-lexer = { path = "../quanta-lexer" }
quanta-ast = { path = "../quanta-ast" }
quanta-parser = { path = "../quanta-parser" }
quanta-typeck = { path = "../quanta-typeck" }
quanta-codegen = { path = "../quanta-codegen" }
quanta-emit = { path = "../quanta-emit" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }
zeroize = "1"
