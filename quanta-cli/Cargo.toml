[package]
publish = false
name = "quanta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quanta-cli"
path = "src/main.rs"

[dependencies]
quanta-lexer = { path = "../quanta-lexer" }
quanta-ast = { path = "../quanta-ast" }
quanta-parser = { path = "../quanta-parser" }
quanta-typeck = { path = "../quanta-typeck" }
quanta-codegen = { path = "../quanta-codegen" }
quanta-emit = { path = "../quanta-emit" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "04e5ae26a089df4e4cc8f20f3973b7cbbee594e3" }
zeroize = "1"
